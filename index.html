<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Java OCP Dashboard v2
    </title>

    <!-- Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    />

    <link
        rel="stylesheet"
        href="./css/dashboard.css"
    />

    <link
        rel="stylesheet"
        href="./css/animations.css"
    />
</head>

<body>

<div class="app">

    <!-- ======================
         SIDEBAR
    ======================= -->
    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- LOGO -->
        <div class="sidebar-top">

            <div class="brand">

                <div class="brand-icon">
                    <i class="fa-brands fa-java"></i>
                </div>

                <div class="brand-text">

                    <h2>
                        Java OCP
                    </h2>

                    <p>
                        Study Dashboard
                    </p>

                </div>

            </div>

            <button
                id="sidebarToggle"
                class="sidebar-toggle"
            >
                <i
                    class="fa-solid fa-bars"
                ></i>
            </button>

        </div>

        <!-- SEARCH -->
        <div class="search-wrapper">

            <i
                class="fa-solid fa-magnifying-glass"
            ></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search modules..."
            />

        </div>

        <!-- FILTERS -->
        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

            <button
                class="filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

        </div>

        <!-- MODULES -->
        <div
            class="module-list"
            id="moduleList"
        >
        </div>

        <!-- FOOTER -->
        <div class="sidebar-footer">

            <div class="streak-card">

                <span>
                    Study Streak
                </span>

                <h3 id="streakCount">
                    0 Days
                </h3>

            </div>

            <div class="progress-card">

                <span>
                    Overall Progress
                </span>

                <h3 id="overallProgress">
                    0%
                </h3>

            </div>

        </div>

    </aside>

    <!-- ======================
         MAIN
    ======================= -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div>

                <h1 id="moduleTitle">
                    Dashboard Overview
                </h1>

                <p id="moduleSubtitle">
                    Oracle Certified Professional
                    Java SE 17 Developer
                </p>

            </div>

            <div class="topbar-right">

                <div
                    class="priority-pill"
                    id="priorityPill"
                >
                    High Priority
                </div>

                <button
                    class="icon-btn"
                    id="bookmarkBtn"
                >
                    <i
                        class="fa-regular fa-bookmark"
                    ></i>
                </button>

                <button
                    class="icon-btn"
                    id="themeBtn"
                >
                    <i
                        class="fa-solid fa-moon"
                    ></i>
                </button>

            </div>

        </header>

        <!-- TABS -->
        <nav class="tabs">

            <button
                class="tab active"
                data-tab="overview"
            >
                Overview
            </button>

            <button
                class="tab"
                data-tab="topics"
            >
                Topics
            </button>

            <button
                class="tab"
                data-tab="traps"
            >
                Exam Traps
            </button>

            <button
                class="tab"
                data-tab="notes"
            >
                Notes
            </button>

            <button
                class="tab"
                data-tab="analytics"
            >
                Analytics
            </button>

        </nav>

        <!-- CONTENT -->
        <section
            class="content"
            id="content"
        >
        </section>

    </main>

</div>

<!-- TOAST -->
<div
    class="toast"
    id="toast"
>
</div>

<!-- Scripts -->
<script src="./js/data.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/analytics.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
